<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px Arial;background:#161914;color:#f3f0e7;width:300px;margin:0;padding:16px}h1{font:20px Georgia;margin:0 0 2px;color:#d8e76e}.version{font-size:10px;color:#aeb1a6;margin:0 0 12px}label{display:block;font-size:10px;letter-spacing:.7px;margin-top:11px;color:#b9bcae}input,select,button{width:100%;box-sizing:border-box;margin-top:5px;border-radius:6px;border:1px solid #4d5245;padding:8px;background:#252a22;color:#fff}button{background:#d8e76e;color:#1c2116;font-weight:bold;cursor:pointer}button+button{margin-top:8px;background:#30362b;color:#f3f0e7}.status{margin-top:13px;padding:10px;background:#242820;border-radius:6px;line-height:1.4;color:#c9ccc2}.note{font-size:10px;color:#aeb1a6;line-height:1.4}</style></head><body><h1>Odyssey Monitor</h1><p class="version">Monitor version 1.0.6</p><label>Dashboard publish URL<input id="url" type="url"></label><label>Private collector token<input id="token" type="password" autocomplete="off"></label><label>Check interval<select id="interval"><option value="30">Every 30 minutes</option><option value="60" selected>Every hour</option><option value="120">Every 2 hours</option></select></label><button id="save">Save & schedule</button><button id="run">Run now</button><div id="status" class="status">Loading…</div><p class="note">Run now uses a temporary AMC tab; this popup may close. Open it again from Chrome’s puzzle-piece Extensions menu. On an error, the AMC tab remains open so you can see what stopped it.</p><script src="popup.js"></script></body></html>
